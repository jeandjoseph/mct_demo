<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #0078D4 0%,
                #512BD4 50%,
                #0F172A 100%
            );
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            color: white;
            max-width: 850px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            animation: fadeIn 1s ease-in-out;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.9;
            line-height: 1.7;
        }

        .badge {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            border-radius: 30px;
            background: rgba(255,255,255,0.2);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .floating {
            position: absolute;
            color: rgba(255,255,255,0.08);
            font-size: 120px;
            animation: float 12s infinite ease-in-out;
        }

        .f1 { top: 8%; left: 10%; }
        .f2 { bottom: 10%; right: 12%; animation-delay: 3s; }
        .f3 { top: 20%; right: 20%; animation-delay: 6s; }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%,100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-25px);
            }
        }
    </style>
</head>
<body>

    <div class="floating f1">🐳</div>
    <div class="floating f2">☁️</div>
    <div class="floating f3">⚙️</div>

    <div class="card">
        <div class="icon">🚀</div>

        <h1>Welcome to the Docker Container & Microservices World</h1>

        <p>
            Modern applications powered by Azure, Docker Containers,
            Cloud-Native Architecture, and Microservices.
        </p>

        <div class="badge">
            ☁️ Azure • 🐳 Docker • ⚙️ Containers • 🚀 DevOps
        </div>
    </div>

</body>
</html>
